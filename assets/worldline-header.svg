<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">STEINSGO — Benhuang Liu</title>
  <desc id="desc">An animated cyber worldline header for a computer vision researcher.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060817"/>
      <stop offset="0.48" stop-color="#15102e"/>
      <stop offset="1" stop-color="#071b2f"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="28%" cy="42%" r="55%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="78%" cy="55%" r="52%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b9cff" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    .hud { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; }
    .star-a { animation: twinkle 1.9s ease-in-out infinite alternate; }
    .star-b { animation: twinkle 2.8s 0.5s ease-in-out infinite alternate; }
    .star-c { animation: twinkle 3.6s 1.1s ease-in-out infinite alternate; }
    .orbit { animation: dash 10s linear infinite; }
    .pulse-a { animation: pulse 2.2s ease-in-out infinite; transform-origin: 390px 251px; }
    .pulse-b { animation: pulse 2.2s 0.7s ease-in-out infinite; transform-origin: 600px 251px; }
    .pulse-c { animation: pulse 2.2s 1.4s ease-in-out infinite; transform-origin: 810px 251px; }
    @keyframes twinkle { from { opacity: .18; } to { opacity: .95; } }
    @keyframes dash { to { stroke-dashoffset: -140; } }
    @keyframes pulse { 0%, 100% { transform: scale(.75); opacity: .25; } 50% { transform: scale(1.35); opacity: .8; } }
  </style>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#violetGlow)"/>
    <rect width="1200" height="300" fill="url(#cyanGlow)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <path d="M-40 202 C140 156 252 230 402 184 S692 130 848 182 1082 230 1240 164"
          fill="none" stroke="url(#signal)" stroke-opacity="0.42" stroke-width="1.5"
          stroke-dasharray="4 12" class="orbit"/>
    <path d="M-20 211 C170 165 268 239 414 193 S690 141 842 191 1084 240 1220 177"
          fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="8" filter="url(#softGlow)"/>

    <g fill="#dbeafe">
      <circle cx="72" cy="63" r="1.5" class="star-a"/><circle cx="154" cy="121" r="1" class="star-c"/>
      <circle cx="234" cy="42" r="1.2" class="star-b"/><circle cx="320" cy="92" r="1" class="star-a"/>
      <circle cx="430" cy="35" r="1.4" class="star-c"/><circle cx="507" cy="76" r="1" class="star-b"/>
      <circle cx="686" cy="40" r="1.3" class="star-a"/><circle cx="748" cy="95" r="1" class="star-c"/>
      <circle cx="872" cy="48" r="1.5" class="star-b"/><circle cx="946" cy="112" r="1" class="star-a"/>
      <circle cx="1058" cy="59" r="1.3" class="star-c"/><circle cx="1130" cy="138" r="1" class="star-b"/>
      <circle cx="104" cy="224" r="1" class="star-b"/><circle cx="1095" cy="231" r="1.4" class="star-a"/>
    </g>

    <g class="hud" font-size="10" fill="#94a3b8">
      <text x="34" y="34">WORLDLINE // 2026.09</text>
      <text x="34" y="52" fill="#4ade80">● SIGNAL STABLE</text>
      <text x="1166" y="34" text-anchor="end">WASEDA IPS // INCOMING</text>
      <text x="1166" y="52" text-anchor="end" fill="#67e8f9">VISUAL INTELLIGENCE</text>
    </g>

    <g stroke="#7dd3fc" stroke-opacity="0.38" fill="none">
      <path d="M26 76V22H80"/><path d="M1120 22h54v54"/>
      <path d="M26 224v54h54"/><path d="M1120 278h54v-54"/>
    </g>

    <text x="600" y="128" text-anchor="middle" fill="#f8fafc" filter="url(#textGlow)"
          font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="13">STEINSGO</text>
    <text x="600" y="159" text-anchor="middle" fill="#a5b4fc"
          font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15" letter-spacing="5">BENHUANG LIU // COMPUTER VISION</text>
    <text x="600" y="188" text-anchor="middle" fill="#cbd5e1" opacity="0.9"
          font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="1.2">making pixels recover, reason, and act</text>

    <g stroke="#64748b" stroke-opacity="0.45" stroke-width="1">
      <path d="M390 251H600H810"/>
    </g>
    <g filter="url(#softGlow)">
      <circle cx="390" cy="251" r="9" fill="none" stroke="#a78bfa" class="pulse-a"/>
      <circle cx="600" cy="251" r="9" fill="none" stroke="#f472b6" class="pulse-b"/>
      <circle cx="810" cy="251" r="9" fill="none" stroke="#22d3ee" class="pulse-c"/>
      <circle cx="390" cy="251" r="3" fill="#a78bfa"/>
      <circle cx="600" cy="251" r="3" fill="#f472b6"/>
      <circle cx="810" cy="251" r="3" fill="#22d3ee"/>
    </g>
    <g class="hud" font-size="10" text-anchor="middle">
      <text x="390" y="278" fill="#c4b5fd">RESTORE</text>
      <text x="600" y="278" fill="#f9a8d4">PERCEIVE</text>
      <text x="810" y="278" fill="#67e8f9">ACT</text>
    </g>

    <rect x="0" y="0" width="1200" height="1" fill="url(#signal)" opacity="0.7">
      <animate attributeName="y" values="0;300;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.28;0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="18" fill="none" stroke="url(#signal)" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
